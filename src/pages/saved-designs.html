<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Designs - Make It Mine</title>

    <style>
        * {
            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: white;
            color: #222;
        }
        a {

            text-decoration: none;
            color: inherit;
        }

        .top-header {
            height: 75px;
            padding: 0 50px;
            background: white;

            border-bottom: 1px solid white;
              display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .logo {
            font-size: 25px;

             font-weight: 700;
        }
        .logo span {
            color: #ff4f81;
        }

        .navbar {
            display: flex;

             gap: 30px;
        }
        .header-actions {
              display: flex;
            gap: 12px;
             
        }

        .header-actions button {
            border: none;
            background: transparent;
            font-size: 19px;
        }

        .page-header {


            background: white;
              text-align: center;
            padding: 55px 20px;
        }

        .page-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
        }

        .design-container {

            max-width: 1100px;

             margin: 45px auto;
            padding: 0 25px;
        }

        .design-grid {

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .design-card {

            background: white;

             border-radius: 16px;
            overflow: hidden;
           
        }
        .design-image {

            height: 250px;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

        }
        .design-image img {

            max-width: 90%;
            max-height: 90%;

            object-fit: contain;
        }
        .design-info {

            padding: 20px;
        }

        .design-info h3 {
            margin-bottom: 7px;
        }
        .design-info p {

              color: #777;
             font-size: 14px;
            margin-bottom: 15px;

        }
        .design-actions {
             display: flex;

            gap: 10px;
        }

        .design-actions a,
        .design-actions button {

            flex: 1;
            padding: 10px;
            text-align: center;

              border-radius: 7px;

            cursor: pointer;

            font-weight: 600;
            font-size: 13px;
        }

        .edit {
            background: #ff4f81;
            color: white;
            border: none;
        }

        .delete {

            background: white;

            border: 1px solid white;

        }
        @media(max-width:800px) {

            .design-grid {

            grid-template-columns: 1fr 1fr;

            }
        }

        @media(max-width:600px) {
            .top-header {
                height: auto;
                 padding: 15px 20px;

                 flex-wrap: wrap;
                gap: 15px;
            }
            .navbar {

                order: 3;
                 width: 100%;
                justify-content: center;
            }
            .design-grid {
                grid-template-columns: 1fr;

            }
        }
    </style>
    <link rel="stylesheet" href="../styles/saved-designs.css">
</head>

<body>

<header class="top-header">

    <div class="logo">
        Make It<span> Mine</span>
    </div>

    <nav class="navbar">


         <a href="./home.html">Home</a>
          <a href="./shop.html">Shop</a>

        <a href="./categories.html">Categories</a>
        <a href="./about.html">About</a>
    </nav>

    <div class="header-actions">
         <button>♡</button>
          <button>🛒</button>
        <button>👤</button>
    </div>

</header>

<section class="page-header">

    <h1>Saved Designs</h1>
    <p>Continue working on your favorite custom designs.</p>
</section>

<main class="design-container">

    <div class="design-grid">

        <article class="design-card">
             <div class="design-image">
                <img src="../assets/images/custom-tshirt.png" alt="Saved T-Shirt Design">
            </div>

            <div class="design-info">
                <h3>My Summer T-Shirt</h3>
                <p>Last edited: 28 September 2026</p>

                <div class="design-actions">
                    <a href="./customize.html" class="edit">
                        Edit Design
                    </a>

                    <button class="delete">
                        Delete
                    </button>
                </div>
            </div>

        </article>

        <article class="design-card">

            <div class="design-image">
                <img src="../assets/images/personalized-hoodie.png" alt="Saved Hoodie Design">
            </div>

            <div class="design-info">
                <h3>Birthday Hoodie</h3>
                <p>Last edited: 25 September 2026</p>

                <div class="design-actions">
                    <a href="./customize.html" class="edit">
                        Edit Design
                    </a>

                    <button class="delete">
                        Delete
                    </button>
                </div>
            </div>

        </article>

        <article class="design-card">

            <div class="design-image">
                <img src="../assets/images/photo-mug.png" alt="Saved Mug Design">
            </div>

            <div class="design-info">
                <h3>Memory Mug</h3>
                <p>Last edited: 21 September 2026</p>

                <div class="design-actions">
                    <a href="./customize.html" class="edit">
                        Edit Design
                    </a>

                    <button class="delete">
                        Delete
                    </button>
                </div>
            </div>

        </article>

    </div>

</main>


<script src="../saved-designs.js"></script>
<script type="module" src="../js/auth-guard.js"></script>
</body>
</html>
