<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Make It Mine</title>

    <style>
        * {
            
            margin: 0;
              padding: 0;

            box-sizing: border-box;
        }


          body {
            font-family: Arial, sans-serif;
             background: white;

            color: black;

        }



        a {

            text-decoration: none;
              color: inherit;
        }
        .top-header {

            height: 75px;
             padding: 0 50px;

              background: white;

            border-bottom: 1px solid white;

         display: flex;
            align-items: center;

             justify-content: space-between;


        }

        .logo {

            font-size: 25px;
            font-weight: 700;
        }



        .logo span {
              color: #ff4f81;
        }


        .navbar {


             display: flex;
              gap: 30px;

        }


        .navbar a:hover {
            color: #ff4f81;

        }
        .header-actions {

            display: flex;

            gap: 12px;
        }

        .header-actions button {
            border: none;
            background: transparent;
            font-size: 19px;
        }



        .page-header {
            background: white;
            padding: 55px 20px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 38px;

            margin-bottom: 10px;
        }
        .page-header p {

            color: #666;
        }


        .orders-container {
            max-width: 1000px;
              margin: 45px auto;
            padding: 0 20px;

        }

        .order-card {


            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
           
        }


        .order-top {
              display: flex;
             justify-content: space-between;
               border-bottom: 1px solid white;
             padding-bottom: 18px;
            margin-bottom: 20px;

        }

        .order-id {
            font-weight: 700;
        }
        .status {
            color: green;
            background: white;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .order-content {
            display: flex;
             
             align-items: center;
            gap: 20px;
        }

        .order-content img {

            width: 100px;
            height: 100px;
              object-fit: contain;
             background: white;
            border-radius: 10px;

        }

        .order-info {
            flex: 1;
        }


    .order-info h3 {
            margin-bottom: 8px;
        }

        .order-info p {

            color: #666;
              margin-bottom: 5px;
        }

        .order-actions {
            display: flex;
            gap: 10px; 

        }
        .btn {

            padding: 10px 17px;
              border-radius: 7px;
            font-size: 13px;
            font-weight: 600;

        }
        .track {
            background: #ff4f81;
            color: white;

        }
        .details {

            border: 1px solid #ddd;

        }

        @media(max-width:700px) {
            .top-header {

                 height: auto;
                   padding: 15px 20px;
                 flex-wrap: wrap;
                gap: 15px;

            }
            .navbar {


                order: 3;
                 width: 100%;
                  justify-content: center;
            }


            .order-content {
                  flex-direction: column;
                align-items: flex-start;
            }

            .order-actions {
                width: 100%;
            }
        }
    </style>

<link rel="stylesheet" href="../styles/my-orders.css">
</head>

<body>

<header class="top-header">

    <div class="logo">
        Make It<span> Mine</span>
    </div>

    <nav class="navbar">

        <a href="./home.html">Home</a>
        <a href="./shop.html">Shop</a>
          <a href="./categories.html">Categories</a>
        <a href="./about.html">About</a>
    </nav>

    <div class="header-actions">
          <button>♡</button>
        <button>🛒</button>
         <button>👤</button>

    </div>

</header>


<section class="page-header">

    <h1>My Orders</h1>
    <p>View and track all your personalized orders.</p>
</section>

<main class="orders-container">

    <div class="orders-toolbar">

        <div class="orders-search">
            <span>🔍</span>

            <input
                type="text"
                id="orderSearch"
                placeholder="Search orders..."
            >
        </div>

        <div class="order-filters">

            <select id="statusFilter">
                <option value="all">All Orders</option>
                <option value="delivered">Delivered</option>
                <option value="shipped">Shipped</option>
                <option value="processing">Processing</option>
                <option value="cancelled">Cancelled</option>
            </select>

            <select id="sortOrders">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="price-high">Price: High to Low</option>
                <option value="price-low">Price: Low to High</option>
            </select>

        </div>

    </div>

    <div id="ordersList"></div>

</main>



<script src="../js/my-orders.js"></script>
<script type="module" src="../js/auth-guard.js"></script>

</body>
</html>
