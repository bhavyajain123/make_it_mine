<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Make It Mine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fc;
            color: #222;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-header {
            height: 75px;
            padding: 0 50px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #ff4f81;
        }

        .navbar {
            display: flex;
            gap: 30px;
        }

        .navbar a:hover {
            color: #ff4f81;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions button {
            border: none;
            background: transparent;
            font-size: 19px;
        }

        .contact-hero {
            background: #fff0f5;
            text-align: center;
            padding: 60px 20px;
        }

        .contact-hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .contact-hero p {
            color: #666;
        }

        .contact-container {
            max-width: 1050px;
            margin: 50px auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 30px;
        }

        .contact-info,
        .contact-form {
            background: #fff;
            padding: 30px;
            border-radius: 17px;
            box-shadow: 0 7px 25px rgba(0,0,0,0.06);
        }

        .contact-info h2,
        .contact-form h2 {
            margin-bottom: 20px;
        }

        .info-item {
            margin-bottom: 22px;
        }

        .info-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .info-item p {
            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            outline: none;
        }

        .form-group input {
            height: 44px;
        }

        .form-group textarea {
            height: 130px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #ff4f81;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        @media(max-width:750px) {
            .top-header {
                height: auto;
                padding: 15px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .navbar {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <link rel="stylesheet" href="../styles/contact.css">
</head>

<body>

<header class="top-header">

    <div class="logo">
        Make It<span> Mine</span>
    </div>

    <nav class="navbar">
        <a href="./home.html">Home</a>
        <a href="./shop.html">Shop</a>
        <a href="./categories.html">Categories</a>
        <a href="./about.html">About</a>
    </nav>

    <div class="header-actions">
        <button>♡</button>
        <button>🛒</button>
        <button>👤</button>
    </div>

</header>

<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We're here to help with your custom orders and questions.</p>
</section>

<main class="contact-container">

    <section class="contact-info">

        <h2>Get In Touch</h2>

        <div class="info-item">
            <strong>📧 Email</strong>
            <p>support@makeitmine.com</p>
        </div>

        <div class="info-item">
            <strong>📞 Phone</strong>
            <p>+91 98765 43210</p>
        </div>

        <div class="info-item">
            <strong>📍 Address</strong>
            <p>New Delhi, India</p>
        </div>

        <div class="info-item">
            <strong>🕐 Support Hours</strong>
            <p>Monday - Saturday, 10 AM - 6 PM</p>
        </div>

    </section>

    <section class="contact-form">

        <h2>Send Us A Message</h2>

        <form>

            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Your email">
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" placeholder="How can we help?">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea placeholder="Write your message..."></textarea>
            </div>

            <button class="submit-btn" type="submit">
                
                Send Message
            </button>

        </form>

    </section>

</main>
<script src="../js/contact.js"></script>
</body>
</html>
