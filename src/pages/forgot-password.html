<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Make It Mine</title>

    <style>
        * {

            margin: 0;
              padding: 0;

            box-sizing: border-box;
            
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fc;
            color: #222;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .top-header   {

            height: 75px;
            padding: 0 50px;

            background: white;
            border-bottom: 1px solid white;


            display: flex;
              align-items: center;

            justify-content: space-between;

        }

        .logo {
            font-size: 25px;
            font-weight: 700;
        }

        .logo span {
            color: #ff4f81;
        }

        .navbar {
            display: flex;
            gap: 30px;
        }

        .header-actions button {
            border: none;
            background: transparent;
            font-size: 19px;
        }

        .forgot-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .forgot-card  {
            
            width: 100%;
            max-width: 470px;

             background: white;
            padding: 40px;
            border-radius: 18px;
            
            text-align: center;
        }

        .forgot-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;

            background:white;

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .forgot-card h1 {
            margin-bottom: 12px;
        }


        .forgot-card > p  {

            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;


        }

        .form-group   {

            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 0 13px;
            border: 1px solid white;
            border-radius: 8px;
            outline: none;
        }

        .form-group input:focus {

            border-color: #ff4f81;

        }

        .submit-btn {
            width: 100%;
            height: 47px;
            border: none; 
            border-radius: 8px;


              background: #ff4f81;
            color: white;

            font-weight: 700;
            cursor: pointer;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            color: #ff4f81;
            font-size: 14px;
        }


        @media(max-width:700px) {
            .top-header  {

                  height: auto;
                padding: 15px 20px;
                flex-wrap: wrap;
                gap: 15px;
            }

            .navbar {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .forgot-card {
                padding: 30px 22px;
            }

        }



    </style>

    <link rel="stylesheet" href="../styles/forgot-password.css">
</head>

<body>

<header class="top-header">

    <div class="logo">
        Make It<span> Mine</span>
    </div>

    <nav class="navbar">

        <a href="./home.html">Home</a>

         <a href="./shop.html">Shop</a>

        <a href="./categories.html">Categories</a>
        <a href="./about.html">About</a>
    </nav>

    <div class="header-actions">
        <button>👤</button>
    </div>

</header>

<main>

    <section class="forgot-section">

        <div class="forgot-card">

            <div class="forgot-icon">
                🔐
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address and we'll
                send you instructions to reset your password.
            </p>

            <form>

                <div class="form-group">

                     <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                           type="email"
                        placeholder="Enter your email"
                    >

                </div>
                <button class="submit-btn" type="submit">


                    Send Reset Link


                </button>



            </form>

              <a href="./login.html" class="back-login">
                ← Back to Login
            </a>

        </div>

    </section>

</main>

<script src="../js/forgot-password.js"></script>
</body>
</html>
