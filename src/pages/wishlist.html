<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Make It Mine</title>

    <style>
        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;

            background: white;
              color: #222;
        }


        a {
            text-decoration: none;
            color: inherit;
        }
        .top-header {
            height: 75px;
            padding: 0 50px;

            background: white;
            border-bottom: 1px solid white;

            display: flex;
            align-items: center;

            justify-content: space-between;
        }



        .logo {
              font-size: 25px;
             font-weight: 700;

        }

        .logo span {
            color: #ff4f81;

        }

        .navbar {
              display: flex;
            gap: 30px;
        }


        .navbar a:hover {
              color: #ff4f81;
        }

        .header-actions {
            display: flex;
            gap: 12px;


        }

        .header-actions button {
            border: none;
               background: transparent;
            font-size: 19px;
        }

        .page-header {
            text-align: center;

            background: white;

            padding: 55px 20px;

        }
        .page-header h1 {

            font-size: 38px;
              margin-bottom: 10px;
 
        }
        .page-header p {
            color: #666;

        }
        .wishlist-container {

            max-width: 1200px; 

              margin: 45px auto;


            padding: 0 25px;

        }
        .wishlist-grid {


            display: grid;
              grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .wishlist-card {
            background: white;
             border-radius: 15px;

            overflow: hidden;
         
        }


        .product-image {
            height: 240px;

            background: white;
              position: relative;
             display: flex;
            align-items: center;

            justify-content: center;

        }

        .product-image img {
            width: 90%;
              height: 90%;
            object-fit: contain;
        }


        .remove {

            position: absolute;
             top: 12px;
            right: 12px;

            border: none;
              background: white;

             width: 35px;
            height: 35px;

            border-radius: 50%;
              cursor: pointer;

        }

        .product-info {
             padding: 18px;
        }
        .product-info h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #ff4f81;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .cart-btn {


            width: 100%;

             padding: 11px;
              border: none;

            background: #ff4f81;
            color: white;
               border-radius: 7px;
             font-weight: 600;
            cursor: pointer;
        }

        @media(max-width:900px) {
            .wishlist-grid {
                  grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:600px) {

            .top-header {
                 height: auto;
                   padding: 15px 20px;
                 flex-wrap: wrap;
                gap: 15px;

            }
            .navbar {
                  order: 3;
                width: 100%;

                justify-content: center;
            }

            .wishlist-grid {
                 grid-template-columns: 1fr;
            }
        }
    </style>

    <link rel="stylesheet" href="../styles/wishlist.css">
</head>

<body>

<header class="top-header">

    <div class="logo">
        Make It<span> Mine</span>
    </div>

    <nav class="navbar">

        <a href="./home.html">Home</a>
         <a href="./shop.html">Shop</a>
          <a href="./categories.html">Categories</a>
        <a href="./about.html">About</a>
    </nav>

    <div class="header-actions">

         <button>♡</button>
        <button>🛒</button>
           <button>👤</button>
    </div>
</header>

<section class="page-header">
    <h1>My Wishlist</h1>
     <p>Save your favorite products for later.</p>
</section>

<main class="wishlist-container">

     <div class="wishlist-grid">

        
     </div>

</main>



<script src="../js/wishlist.js"></script>
<script type="module" src="../js/auth-guard.js"></script>


</body>
</html>
